name:                OhTT
version:             0.1.0.0
github:              "githubuser/OhTT"
license:             BSD-3-Clause
author:              "Author name here"
maintainer:          "example@example.com"
copyright:           "2026 Author name here"

extra-source-files:
- README.md
- CHANGELOG.md
# Metadata used when publishing your package
# synopsis:            Short description of your package
# category:            Web

# To avoid duplicated efforts in documentation and dealing with the
# complications of embedding Haddock markup inside cabal files, it is
# common to point users to the README.md file.
description: TODO

dependencies:
- base >= 4.7 && < 5
- containers
- megaparsec

ghc-options:
- -Wall
- -Wcompat
- -Widentities
- -Wincomplete-record-updates
- -Wincomplete-uni-patterns
- -Wmissing-export-lists
- -Wmissing-home-modules
- -Wpartial-fields
- -Wredundant-constraints
- -Wno-unused-matches
- -Wno-name-shadowing 
- -Wno-missing-signatures
- -Wno-missing-export-lists 
- -Wno-unused-imports
- -Wno-unused-local-binds
- -Wno-incomplete-uni-patterns
- -Wno-unused-do-bind
- -Wno-orphans

default-extensions:
- DerivingVia
- DeriveAnyClass
- FlexibleContexts
- GeneralizedNewtypeDeriving
- LambdaCase
- OverloadedStrings
- PatternSynonyms
- StandaloneDeriving
- Strict
- TupleSections
- ViewPatterns
- GADTs

library:
  source-dirs: src

executables:
  OhTT-exe:
    main:                Main.hs
    source-dirs:         app
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - OhTT

tests:
  OhTT-test:
    main:                Spec.hs
    source-dirs:         test
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - OhTT
    - hspec
    - QuickCheck
